services:
  # ---- PostgreSQL 15 Database ----
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist data across restarts
      - ./media:/app/media
    env_file:
      - .env  # Injects POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    ports:
      - "5432:5432"  # Expose for local DB tools (pgAdmin, DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Django Backend ----
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app  # Live code reload — edits on host appear instantly
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy  # Wait for PostgreSQL to be READY, not just started

volumes:
  postgres_data:  # Named volume — survives docker-compose down

  